[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# libc is a direct dependency of `store` only (the Unix open flags in
# `config_file`); it was already in the tree through other crates.
libc = "0.2"
# `tree-sitter` ships the highlighter; each language feature adds one grammar.
# They belong to the application, so they are turned on here once rather than by
# whichever crate happens to render a code fence.
#
# Native only, and that is not a preference: `gpui-component` declares its
# `tree-sitter` dependency under `[target.'cfg(not(target_family = "wasm"))']`
# but its `tree-sitter*` *features* turn it on unconditionally, so asking for
# them while compiling for wasm fails to find the crate. The grammar is also C
# that no browser runs. The web build renders code fences without it (the kit
# falls back to its wasm highlighter stub), which is the same fence, uncoloured.
gpui-kit = { version = "=0.7.0" }
# `base64` is a direct dependency of `session` only: a pasted image travels as
# base64 in `input.send`'s `images`, and the encoder was already in the tree.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The terminal pane's two halves: `alacritty_terminal` parses the escape
# stream into a grid, `portable-pty` owns the pseudo-terminal the shell runs
# on. Both are pinned to the versions whose APIs `crates/terminal` is written
# against.
alacritty_terminal = "0.26"
portable-pty = "0.9"
