[package]
name = "proofs"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# The real-binary proofs: the transport they drive, and the argv/catalog/history
# readers the app itself uses.
swarm_client = { path = "../swarm_client" }
store = { path = "../store" }
serde_json = { workspace = true }
async-channel = "2"
libc = "0.2"


[dev-dependencies]
# t09 folds the stream through the app's own model, as a tab does.
session = { path = "../session" }
