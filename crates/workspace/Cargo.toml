[package]
name = "workspace"
version.workspace = true
edition.workspace = true

[dependencies]
gpui-kit = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
async-channel = "2"
session = { path = "../session" }
settings = { path = "../settings" }
store = { path = "../store" }
widgets = { path = "../widgets" }
swarm_client = { path = "../swarm_client" }
tab_engine = { path = "../tab_engine" }
transcript = { path = "../transcript" }
agent_list = { path = "../agent_list" }
composer = { path = "../composer" }
terminal = { path = "../terminal" }

# The folder picker behind `host.rs`, and a desktop's alone: a browser has no
# system dialog, and `rfd`'s web backend cannot pick a folder at all (`pick_folder`
# does not exist for `wasm32`). Gating the dependency keeps a browser from
# compiling the native backends. See `host.rs`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rfd = "0.17"

# The page's own executor, for the browser launch: opening a tab is a `fetch`
# (`POST /api/tabs`), so `TabContent::launch` runs as a task and draws a `Booting`
# tab while it is in flight. A host needs none of it — its launch is a spawn on a
# thread.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
# The page's own globals and DOM: the picker asks the server for a directory
# listing (`GET /api/fs`) and puts up the page's own prompt to choose from it.
web-sys = { version = "0.3", features = [
    "Response",
    "Window",
    # The attachment picker: the page's own file dialog is an `<input type=file>`,
    # clicked, and what it hands back is a `FileList` of `File`s whose bytes arrive
    # through a `FileReader` — the only way a page can read a file it was given.
    "Document",
    "Element",
    "HtmlInputElement",
    "File",
    "FileList",
    "FileReader",
    "Blob",
] }
# The page's own clock, for the step ticker: `std::time` is unimplemented on
# `wasm32-unknown-unknown` (`SystemTime::now()` panics there, it does not return an
# error), and a browser's clock is `Date.now()` — which is `js_sys`. Native builds
# read the system clock instead and never compile this. See `host::now_millis`.
js-sys = "0.3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
swarm_client = { path = "../swarm_client", features = ["test-harness"] }
# The transcript counts the rows a frame builds and the frames it renders, which is
# what the tests over this crate's embedding of it assert.
transcript = { path = "../transcript", features = ["test-support"] }
image = "0.25"
