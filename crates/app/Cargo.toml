[package]
name = "evo-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "evo_desktop"
path = "src/lib.rs"

[[bin]]
name = "evo-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
anyhow = { workspace = true }
workspace = { path = "../workspace" }
store = { path = "../store" }
session = { path = "../session" }
tab_engine = { path = "../tab_engine" }
settings = { path = "../settings" }
serde_json = { workspace = true }
async-channel = "2"
libc = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# The example that draws the screenshots runs in a proof's world: a throwaway
# HOME whose init.lisp registers the scripted model.
proofs = { path = "../proofs" }
# The probe crops its pictures in-process (already in the lock through gpui).
image = { version = "0.25", default-features = false, features = ["png"] }
