[package]
name = "evo-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "evo_desktop"
path = "src/lib.rs"

[[bin]]
name = "evo-desktop"
path = "src/main.rs"

[dependencies]
# The syntax highlighter's grammars belong to the application, so they are turned
# on here rather than in the workspace: this is the native binary, and a browser
# cannot run them (see the note in the workspace `Cargo.toml`). The desktop app
# and the web frontend therefore share one gpui UI codebase and differ only in
# which of them is compiled in.
gpui-kit = { workspace = true, features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
] }
anyhow = { workspace = true }
workspace = { path = "../workspace" }
store = { path = "../store" }
# The design's palette, as a crate shared with the browser frontend: this shell
# installs it, and so does `crates/webapp`, so the two draw the same window.
theme = { path = "../theme" }
session = { path = "../session" }
tab_engine = { path = "../tab_engine" }
settings = { path = "../settings" }
# The reader's transcript zoom (§7.2): the View menu's three actions set it, and
# the global is what every open transcript reads.
transcript = { path = "../transcript" }
# The terminal's font (§13): Settings saves it, the global is what every pane reads.
terminal = { path = "../terminal" }
serde_json = { workspace = true }
async-channel = "2"
libc = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# The zoom test's window: a real transcript beside a real composer, to show that
# the View menu's zoom reaches one and not the other.
composer = { path = "../composer" }
# The example that draws the screenshots runs in a proof's world: a throwaway
# HOME whose init.lisp registers the scripted model.
proofs = { path = "../proofs" }
# The probe crops its pictures in-process (already in the lock through gpui).
image = { version = "0.25", default-features = false, features = ["png"] }
# The traffic-light check reads AppKit's own button frames off the real window.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
raw-window-handle = "0.6"
