[package]
name = "swarm_client"
version.workspace = true
edition.workspace = true

[features]
default = []
# The fake serve this crate's tests (and its dependents' tests) drive the client
# against: a temp tab directory, a real spawn, the protocol on the wire. Off by
# default so a production consumer never compiles it.
test-harness = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-channel = "2"

# `libc` is the signals and the pid calls the shutdown ladder is made of
# (`killpg`, `waitpid`, `SIGTERM`), and `std::process` is the spawn it ladders
# down from. Both are host-only, so the whole of `server` is too.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The browser transport, and it is the browser's alone: native keeps the
# hand-rolled client in `http.rs` (a socket, a thread, and the bearer token), which
# `crates/web`'s proxy also drives. So `reqwest` is asked for with no default
# features and no TLS — on wasm it is `fetch`, and the browser brings its own TLS.
#
# `eventsource-stream` is the SSE framing: it turns the reply body into a stream of
# whole events. `futures-util` is the `StreamExt` that drives it. Hand-rolling the
# framing is what this replaces — see the note at the top of `fetch.rs`.
[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
eventsource-stream = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# `spawn_local` is the page's executor, and `Promise`/`setTimeout` is the only
# clock a backoff has there.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# `window.location.origin`: a browser's `fetch` refuses a relative URL, so a
# same-origin path prefix is resolved against the page's own origin before it is
# handed to `reqwest`.
web-sys = { version = "0.3", features = ["Location", "Window"] }

[dev-dependencies]
# The real-binary test sends a body the size of a pasted screenshot: the base64 an
# image travels as is the same encoder `session` uses.
base64 = { workspace = true }
# Features are unified for the test build, which turns `test-harness` on for
# `cargo test -p swarm_client` without a plain dependent ever compiling it.
swarm_client = { path = ".", features = ["test-harness"] }

[[test]]
name = "protocol_e2e"
required-features = ["test-harness"]

[[test]]
name = "real_server"
required-features = ["test-harness"]

[[test]]
name = "real_swarm"
required-features = ["test-harness"]
