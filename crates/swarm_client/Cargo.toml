[package]
name = "swarm_client"
version.workspace = true
edition.workspace = true

[features]
default = []
# The fake serve this crate's tests (and its dependents' tests) drive the client
# against: a temp tab directory, a real spawn, the protocol on the wire. Off by
# default so a production consumer never compiles it.
test-harness = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-channel = "2"
libc = "0.2"

[dev-dependencies]
# The real-binary test sends a body the size of a pasted screenshot: the base64 an
# image travels as is the same encoder `session` uses.
base64 = { workspace = true }
# Features are unified for the test build, which turns `test-harness` on for
# `cargo test -p swarm_client` without a plain dependent ever compiling it.
swarm_client = { path = ".", features = ["test-harness"] }

[[test]]
name = "protocol_e2e"
required-features = ["test-harness"]

[[test]]
name = "real_server"
required-features = ["test-harness"]

[[test]]
name = "real_swarm"
required-features = ["test-harness"]
