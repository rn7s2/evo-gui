[package]
name = "swarm_client"
version.workspace = true
edition.workspace = true

[features]
default = []
# The fake serve this crate's tests (and its dependents' tests) drive the client
# against: a temp tab directory, a real spawn, the protocol on the wire. Off by
# default so a production consumer never compiles it.
test-harness = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-channel = "2"

# `libc` is the signals and the pid calls the shutdown ladder is made of
# (`killpg`, `waitpid`, `SIGTERM`), and `std::process` is the spawn it ladders
# down from. Both are host-only, so the whole of `server` is too.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The browser transport: `fetch` for one request, and a `ReadableStream` read
# chunk by chunk for the op stream. `EventSource` is deliberately not used — it
# cannot carry an `Authorization` header, and the protocol is bearer-token.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Window",
] }

[dev-dependencies]
# The real-binary test sends a body the size of a pasted screenshot: the base64 an
# image travels as is the same encoder `session` uses.
base64 = { workspace = true }
# Features are unified for the test build, which turns `test-harness` on for
# `cargo test -p swarm_client` without a plain dependent ever compiling it.
swarm_client = { path = ".", features = ["test-harness"] }

[[test]]
name = "protocol_e2e"
required-features = ["test-harness"]

[[test]]
name = "real_server"
required-features = ["test-harness"]

[[test]]
name = "real_swarm"
required-features = ["test-harness"]
