[package]
name = "store"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# `O_NOFOLLOW`/`O_NONBLOCK`/`ELOOP` for opening a config file without following
# a symlink (see `config_file::open_regular`). Unix only: the constants do not
# exist elsewhere, and the non-Unix fallback in that function does not need them.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `Date.now()` is the clock a page has. `std::time` is unimplemented on
# `wasm32-unknown-unknown` — `SystemTime::now()` panics rather than returning an
# error — and this crate reads the clock in `time::now_epoch`, which the launch
# path reaches when it mints a tab id (`paths::fill_random`'s fallback, taken
# whenever `/dev/urandom` cannot be opened, which is every browser).
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"

[[bin]]
name = "store-lock-probe"
path = "src/bin/lock_probe.rs"
